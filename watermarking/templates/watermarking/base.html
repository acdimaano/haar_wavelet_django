<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Haar Wavelet Watermarking{% endblock %}</title>
  <style>
    :root {
      --accent: #2a5db0;
      --accent-dark: #1e4687;
      --border: #d8dee6;
      --bg-soft: #f6f8fb;
      --error: #b3261e;
      --error-bg: #fdecea;
      --text: #1f2430;
      --muted: #5b6472;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      color: var(--text);
      line-height: 1.5;
      background: #fff;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    h2 { font-size: 1.25rem; margin-top: 0; }
    .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
    nav {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    nav a {
      padding: 10px 16px;
      text-decoration: none;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      font-weight: 500;
    }
    nav a.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      background: var(--bg-soft);
      margin-bottom: 24px;
    }
    form p { margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type="file"],
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 0.95rem;
    }
    .helptext { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    ul.errorlist { color: var(--error); list-style: none; padding: 0; margin: 4px 0; font-size: 0.9rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .error-box {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid #f3c6c2;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .result img {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .result { margin-top: 24px; }
    .download-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--accent-dark);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .note {
      font-size: 0.88rem;
      color: var(--muted);
      background: #fff8e6;
      border: 1px solid #f0dca0;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 16px;
    }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.8rem; text-align: center; }
    code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Haar Wavelet Image Watermarking</h1>
  <p class="subtitle">Embed a hidden watermark into an image, or extract one back out, using a 2D Haar DWT.</p>

  <nav>
    <a href="{% url 'watermarking:embed' %}" class="{% block nav_embed %}{% endblock %}">Embed watermark</a>
    <a href="{% url 'watermarking:extract' %}" class="{% block nav_extract %}{% endblock %}">Extract watermark</a>
  </nav>

  {% block content %}{% endblock %}

  <footer>Haar wavelet watermarking demo &middot; Django</footer>
</body>
</html>
